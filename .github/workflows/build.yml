name: Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tag v1.2.3 -> version 1.2.3; manual runs use the csproj <Version> with a -dev suffix
      - name: Publish
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"
          else
            VERSION_ARG="-p:VersionSuffix=dev.${GITHUB_RUN_NUMBER}"
          fi
          dotnet publish ProductDescGen.csproj -p:PublishProfile=${{ matrix.rid }} $VERSION_ARG

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path bin/publish/${{ matrix.rid }}/* -DestinationPath ProductDescGen-${{ matrix.rid }}.zip

      # tar keeps the executable bit, which a zip artifact would lose
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf ProductDescGen-${{ matrix.rid }}.tar.gz -C bin/publish/${{ matrix.rid }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ProductDescGen-${{ matrix.rid }}
          path: ProductDescGen-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
